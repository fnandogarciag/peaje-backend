server:
    servlet:
        context-path: /api
    port: 5000
    address: 0.0.0.0
spring:
    profiles:
        active: none
    application:
        name: backend
    datasource:
        driver-class-name: org.postgresql.Driver
        url: jdbc:postgresql://localhost:5432/db
        username: user
        password: pass
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
